<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거상 백호 사랑방 — 거상 AI 질문</title>
<meta name="description" content="거상 커뮤니티 글을 근거로, 출처 링크와 작성일을 함께 보여주는 거상 전용 AI 질문답변.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="common.css">
<style>
  /* 검색 히어로 */
  .hero { padding:64px 0 28px; text-align:center; }
  .hero h1 { margin:0 0 10px; font-size:clamp(26px,4.5vw,40px); font-weight:800; letter-spacing:-.02em; line-height:1.25; }
  .hero h1 em { font-style:normal; color:var(--acc); }
  .hero p { margin:0 auto 28px; max-width:620px; color:var(--tx2); font-size:15px; }
  .ask { display:flex; gap:8px; max-width:760px; margin:0 auto; padding:8px; background:var(--panel); border:1px solid var(--line2); border-radius:18px; }
  .ask:focus-within { border-color:var(--acc); box-shadow:0 0 0 4px var(--accdim); }
  .ask input { flex:1; min-width:0; padding:12px 14px; font:inherit; font-size:17px; color:var(--tx); background:transparent; border:0; outline:0; }
  .ask input::placeholder { color:var(--tx3); }
  .ask button { padding:0 26px; font:inherit; font-weight:700; color:#0b0c0f; background:var(--acc); border:0; border-radius:12px; cursor:pointer; }
  .ask button:hover { background:var(--acc2); }
  .ask button:disabled { opacity:.5; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:760px; margin:16px auto 0; }
  .chips button { padding:6px 12px; font:inherit; font-size:13px; color:var(--tx2); background:var(--plate); border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  .chips button:hover { color:var(--acc2); border-color:var(--acc); }
  .stats { margin-top:18px; color:var(--tx3); font-size:13px; }

  /* 본문 2단: 답변 + 사이드 광고 */
  .cols { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start; padding-bottom:40px; }
  @media (max-width:980px) { .cols { grid-template-columns:minmax(0,1fr); } .ad { display:none; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin-bottom:16px; }
  .q { font-weight:700; font-size:17px; margin-bottom:12px; }
  .q::before { content:"Q."; color:var(--acc); margin-right:8px; }
  .answer p { margin:.55em 0; } .answer ul,.answer ol { padding-left:1.3em; margin:.4em 0; }
  .answer h1,.answer h2,.answer h3 { font-size:16px; margin:1.1em 0 .3em; color:var(--acc2); }
  .answer strong { color:#fff; }
  .answer table { border-collapse:collapse; width:100%; font-size:14px; display:block; overflow-x:auto; }
  .answer th,.answer td { border:1px solid var(--line2); padding:6px 10px; text-align:left; }
  .cite { font-size:12px; vertical-align:super; text-decoration:none; color:var(--acc2); font-weight:700; padding:0 1px; }
  .sources { margin-top:16px; padding-top:14px; border-top:1px dashed var(--line2); font-size:14px; }
  .sources .t { color:var(--tx3); font-size:12px; font-weight:700; margin-bottom:6px; letter-spacing:.04em; }
  .sources div.s { margin:5px 0; } .sources a { color:var(--tx); text-underline-offset:3px; } .sources a:hover { color:var(--acc2); }
  .meta { color:var(--tx3); font-size:12px; margin-left:4px; }
  .note { margin-top:12px; color:var(--tx3); font-size:12px; }
  .badge { display:inline-block; margin-left:8px; padding:1px 8px; font-size:11px; font-weight:700; color:var(--ok); border:1px solid var(--ok); border-radius:999px; vertical-align:middle; }
  .error { color:var(--bad); } .loading { color:var(--tx2); }
  .dots::after { content:""; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  h2.sec { margin:28px 0 12px; font-size:15px; color:var(--tx2); font-weight:700; }
  details.card { padding:14px 20px; } details summary { cursor:pointer; font-weight:600; list-style:none; }
  details summary::before { content:"Q."; color:var(--acc); margin-right:8px; }
  details[open] summary { margin-bottom:12px; }

</style>
</head>
<body>

<header class="site-head"><div class="wrap">
  <a class="logo" href="index.html"><span class="mark">白</span>거상 백호 사랑방</a>
  <nav class="gnb">
    <a href="index.html" class="on">AI 질문</a>
    <a href="gallery.html">갤러리</a>
    <a href="board.html">자유게시판</a>
  </nav>
</div></header>

<section class="hero"><div class="wrap">
  <h1>거상, <em>최신 글 기준</em>으로 물어보세요</h1>
  <p>커뮤니티 글과 도감을 매시간 모아서, 그 글만 근거로 답합니다. 모든 답변에 출처 링크와 작성일이 붙고, 자료가 없으면 없다고 말합니다.</p>
  <form class="ask" id="form">
    <input type="text" id="question" placeholder="예: 뉴비 사천왕 뭐 고르는 게 좋아?" maxlength="300" autocomplete="off" autofocus>
    <button id="send">질문</button>
  </form>
  <div class="chips" id="chips">
    <button type="button">뉴비 사천왕 뭐 고르는 게 좋아?</button>
    <button type="button">도사여 클탐 줄이려면 뭐부터 맞춰야 해?</button>
    <button type="button">천년호 가는 법</button>
    <button type="button">혼천의 어떻게 만들어?</button>
  </div>
  <div class="stats" id="stats"></div>
</div></section>

<div class="wrap cols">
  <main>
    <div id="result"></div>
    <h2 class="sec">최근 질문</h2>
    <div id="history"></div>
  </main>
  <aside class="ad">광고</aside>
</div>

<footer><div class="wrap">
  거상 백호 사랑방은 천하제일상 거상의 팬 사이트이며 게임사와 무관합니다. AI 답변은 수집된 커뮤니티 글을 요약한 것으로 틀릴 수 있으니, 중요한 내용은 출처 링크에서 원문을 확인하세요. 원문의 권리는 각 작성자와 사이트에 있습니다.
</div></footer>
<div class="adfix">광고</div>

<script>
// 공개 사이트(dabangzz.com)에서는 미니PC의 답변 서버로, 그 외(내 컴퓨터)에서는 같은 주소로 질문을 보낸다
const API_BASE = /(^|\.)dabangzz\.com$/.test(location.hostname) ? "https://ai.dabangzz.com" : "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = iso => new Date(iso).toLocaleString("ko-KR", {dateStyle:"medium", timeStyle:"short"});

function renderAnswer(r) {
  const urls = Object.fromEntries(r.sources.map(s => [s.n, s.url]));
  let html = DOMPurify.sanitize(marked.parse(r.answer));
  html = html.replace(/\[(\d+)\]/g, (m, n) => urls[n] ? `<a class="cite" href="${esc(urls[n])}" target="_blank" rel="noopener">[${n}]</a>` : m);
  const src = r.sources.map(s =>
    `<div class="s">[${s.n}] <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><span class="meta">${esc(s.source)} · ${esc(s.date || "도감 자료")}</span></div>`).join("");
  const cached = r.cached_at ? `<div class="note">같은 질문에 ${when(r.cached_at)} 에 만든 답변입니다.</div>` : "";
  return `<div class="answer">${html}</div>` + (src ? `<div class="sources"><div class="t">근거 글</div>${src}</div>` : "") + cached;
}

async function loadStats() {
  try {
    const s = await (await fetch(API_BASE + "/api/stats")).json();
    const left = s.left_today == null ? "" : ` · 오늘 남은 질문 ${s.left_today}회`;
    $("stats").textContent = `수집한 글 ${s.docs.toLocaleString()}건 · 마지막 수집 ${s.last_crawl ? when(s.last_crawl) : "-"}${left}`;
  } catch { $("stats").textContent = "답변 서버가 잠시 쉬고 있습니다. 아래 최근 질문은 볼 수 있습니다."; }
}

async function loadHistory() {
  try {
    const rows = await (await fetch(API_BASE + "/api/history")).json();
    $("history").innerHTML = rows.map(r =>
      `<details class="card"><summary>${esc(r.question)}<span class="meta">${when(r.created_at)}</span></summary>${renderAnswer(r)}</details>`
    ).join("") || '<div class="note">아직 없습니다.</div>';
  } catch { $("history").innerHTML = ""; }
}

async function ask(question) {
  $("send").disabled = true;
  $("result").innerHTML = `<div class="card"><div class="q">${esc(question)}</div><div class="loading">자료를 찾고 답변을 쓰는 중<span class="dots"></span> (10~30초)</div></div>`;
  $("result").scrollIntoView({block:"nearest"});
  try {
    const resp = await fetch(API_BASE + "/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question})});
    const r = await resp.json();
    $("result").innerHTML = `<div class="card"><div class="q">${esc(question)}</div>` +
      (r.error ? `<div class="error">${esc(r.error)}</div>` : renderAnswer(r)) + `</div>`;
    if (!r.error) { $("question").value = ""; loadStats(); loadHistory(); }
  } catch {
    $("result").innerHTML = `<div class="card error">답변 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.</div>`;
  }
  $("send").disabled = false;
}

$("form").addEventListener("submit", e => { e.preventDefault(); const q = $("question").value.trim(); if (q) ask(q); });
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") { $("question").value = e.target.textContent; ask(e.target.textContent); } });
loadStats(); loadHistory();
</script>
</body>
</html>
